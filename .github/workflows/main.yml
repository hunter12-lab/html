name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          # Keep Network Level Authentication enabled
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1

          # Use the default secure RDP security layer
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' -Value 1

          # Enable the built-in Remote Desktop firewall rules
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          # Restrict RDP firewall access to the Tailscale subnet
          Get-NetFirewallRule -DisplayGroup 'Remote Desktop' |
            Disable-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale-Only' `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' `
            -Action Allow `
            -Profile Any

          # Restart RDP service
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          $username = 'RDP'

          # Generate a random password
          $bytes = New-Object byte[] 32
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $rng.GetBytes($bytes)
          $password = [Convert]::ToBase64String($bytes) + 'aA1!'

          $securePass = ConvertTo-SecureString `
            $password -AsPlainText -Force

          # Create or update the local account
          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $username -Password $securePass
          } else {
            New-LocalUser `
              -Name $username `
              -Password $securePass `
              -AccountNeverExpires
          }

          # Grant standard RDP access, not administrator access
          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member $username `
            -ErrorAction SilentlyContinue

          # Store the credential in the runner environment only
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host 'RDP account created.'

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'
          $installer = Join-Path $env:TEMP 'tailscale.msi'

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList '/i', "`"$installer`"", '/quiet', '/norestart' `
            -Wait -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed: $($process.ExitCode)"
          }

      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TS_AUTHKEY) {
            throw 'Add TAILSCALE_AUTH_KEY in repository
